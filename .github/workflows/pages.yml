name: Deploy Visual Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build verified media and content
        run: |
          python -m pip install Pillow==13.0.0
          python scripts/build-curation.py
          python scripts/sync-data.py
          python scripts/build-catalog.py
          python scripts/build-display-media.py
          node scripts/verify-gallery.cjs
          node tests/avatar.cjs
          node tests/midjourney-data.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
