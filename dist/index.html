<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas · AI 影像灵感库</title><meta name="description" content="有出处的 AI 图像与视频作品，探索创作者的公开提示词。"><link rel="stylesheet" href="style.css?v=20261114-desktop-qa"></head>
<body>
<header class="mobile-header"><a href="#" class="wordmark">atlas</a><button id="menuToggle" aria-label="打开导航" aria-expanded="false"></button></header>
<aside id="sidebar" class="sidebar"><a href="#" class="wordmark">atlas</a><nav aria-label="主要导航"><h2>浏览</h2><button data-type="all" class="selected">精选作品 <span id="totalCount"></span></button><button data-type="image">图像与动图</button><button data-type="video">视频作品</button><button data-type="saved">我的收藏 <span id="savedCount"></span></button></nav><section class="models"><h2>模型</h2><div id="modelLinks"></div></section><div class="side-bottom"><h2>更多</h2><a id="repo" target="_blank" rel="noopener">GitHub 项目 ↗</a><button id="aboutButton">关于与来源</button></div></aside>
<main class="page" id="page"><header class="page-heading"><h1 id="pageTitle">精选作品</h1><label class="search"><span id="searchIcon"></span><input id="search" type="search" placeholder="搜索作品与提示词" aria-label="搜索作品与提示词"><button id="clearSearch" class="search-clear" aria-label="清除搜索" hidden>×</button><kbd>⌘ K</kbd></label></header><div class="toolbar"><div id="categories" class="categories" aria-label="创作主题"></div><div class="toolbar-right"><label class="prompt-toggle"><input type="checkbox" id="promptOnly" role="switch"><span class="switch-track" aria-hidden="true"></span><span>附提示词</span></label><div class="sort"><select id="sort" aria-label="排序" hidden><option value="curated">编辑排序</option><option value="recent">最近核实</option></select><button id="sortTrigger" class="sort-trigger" aria-expanded="false" aria-controls="sortMenu">编辑排序 <span aria-hidden="true">⌄</span></button><div id="sortMenu" class="sort-menu" hidden><p>作品顺序</p><button data-sort="curated" aria-pressed="true">编辑排序<span>按精选顺序浏览</span></button><button data-sort="recent" aria-pressed="false">最近核实<span>先看近期核验的作品</span></button></div></div></div></div><div id="grid" class="masonry" aria-label="作品画廊"></div><div id="empty" hidden><h2>没有找到相关作品</h2><p>换个关键词，或清除筛选再看看。</p><button id="reset" class="plain-button">清除筛选</button></div><footer class="feed-footer"><span id="count" aria-live="polite"></span><button id="loadMore" class="plain-button">加载更多</button></footer></main>
